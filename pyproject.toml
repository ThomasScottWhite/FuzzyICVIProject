[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmsc-study"
version = "0.1.0"
description = "Separate baseline and experimental implementations of Deep Multiple Self-Supervised Clustering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.1",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.scripts]
dmsc-baseline = "dmsc_baseline.cli:main"
dmsc-custom = "dmsc_custom.cli:main"
dmsc-experiment-1 = "experiments.experiment_1.main:main"
dmsc-experiment-3 = "experiments.experiment_3.main:main"

[tool.setuptools.packages.find]
include = ["dmsc_baseline*", "dmsc_custom*", "experiments*"]
